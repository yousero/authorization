<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 20px;
  }

  .login-card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    padding: 40px 32px;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
  }

  .login-card h1 {
    font-size: 26px;
    margin-bottom: 8px;
    color: #1a1a2e;
    text-align: center;
  }

  .login-card p {
    font-size: 14px;
    color: #888;
    text-align: center;
    margin-bottom: 28px;
  }

  .field {
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    font-size: 13px;
    color: #444;
    margin-bottom: 6px;
    font-weight: 500;
  }

  .field input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #e0e0e0;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .field input:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
  }

  .options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    margin-bottom: 22px;
    color: #666;
  }

  .options label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  .options a {
    color: #667eea;
    text-decoration: none;
  }

  .options a:hover { text-decoration: underline; }

  .btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s;
  }

  .btn:hover {
    box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
  }

  .btn:active { transform: scale(0.98); }

  .register-link {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: #666;
  }

  .register-link a {
    color: #667eea;
    text-decoration: none;
    font-weight: 600;
  }

  .register-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<form class="login-card" onsubmit="handleLogin(event)">
  <h1>Sign In</h1>
  <p>Welcome back 👋</p>

  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com" required>
  </div>

  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" required minlength="6">
  </div>

  <div class="options">
    <label><input type="checkbox"> Remember me</label>
    <a href="#">Forgot password?</a>
  </div>

  <button type="submit" class="btn">Sign In</button>

  <div class="register-link">
    Don't have an account? <a href="#">Sign up</a>
  </div>
</form>

<script>
  function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    // Send the data to your server here (fetch/post)
    console.log('Login:', { email, password });
    alert(`Login attempt:\n${email}`);
  }
</script>

</body>
</html>
