<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    /* ---------- Card ---------- */
    .login-card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Header ---------- */
    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-header h1 {
      font-size: 26px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 8px;
    }

    .login-header p {
      font-size: 15px;
      color: #718096;
    }

    /* ---------- Inputs ---------- */
    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      height: 56px;
      padding: 0 16px 0 48px;
      border: 2px solid #e1e5ee;
      border-radius: 12px;
      background: #fff;
      font-family: inherit;
      font-size: 16px;
      color: #2d3748;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .input-group input[type="password"] {
      padding-right: 48px;
    }

    .input-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      color: #9aa3b2;
      pointer-events: none;
      transition: color 0.25s;
    }

    .input-group:focus-within .input-icon {
      color: #667eea;
    }

    .input-group label {
      position: absolute;
      left: 44px;
      top: 50%;
      transform: translateY(-50%);
      padding: 0 4px;
      background: #fff;
      font-size: 16px;
      color: #9aa3b2;
      pointer-events: none;
      transition: top 0.2s ease, font-size 0.2s ease, color 0.2s ease;
    }

    .input-group input:focus ~ label,
    .input-group input:not(:placeholder-shown) ~ label {
      top: 0;
      font-size: 12px;
      font-weight: 500;
      color: #667eea;
    }

    /* Show password button */
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      padding: 4px;
      border: none;
      background: none;
      color: #9aa3b2;
      cursor: pointer;
      transition: color 0.2s;
    }

    .toggle-password:hover { color: #667eea; }
    .toggle-password svg { width: 20px; height: 20px; }
    .toggle-password .eye-off { display: none; }
    .toggle-password.visible .eye     { display: none; }
    .toggle-password.visible .eye-off { display: block; }

    /* ---------- Options ---------- */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #5a6478;
      cursor: pointer;
      user-select: none;
    }

    .remember input {
      width: 16px;
      height: 16px;
      accent-color: #667eea;
      cursor: pointer;
    }

    a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    a:hover {
      color: #764ba2;
      text-decoration: underline;
    }

    /* ---------- Buttons ---------- */
    .btn-login {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(102, 126, 234, 0.45);
    }

    .btn-login:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* ---------- Divider & social button ---------- */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 26px 0;
      font-size: 14px;
      color: #9aa3b2;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e1e5ee;
    }

    .btn-social {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px;
      border: 2px solid #e1e5ee;
      border-radius: 12px;
      background: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      color: #2d3748;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .btn-social:hover {
      border-color: #c3cbe0;
      background: #f8f9fc;
    }

    /* ---------- Footer ---------- */
    .signup {
      margin-top: 24px;
      text-align: center;
      font-size: 14px;
      color: #5a6478;
    }

    .form-message {
      display: none;
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
    }

    .form-message.show { display: block; }

    .form-message.success {
      background: #ecfdf5;
      color: #059669;
    }

    /* ---------- Mobile ---------- */
    @media (max-width: 480px) {
      .login-card {
        padding: 32px 22px;
        border-radius: 16px;
      }
      .login-header h1 { font-size: 23px; }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Logo -->
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>

    <!-- Header -->
    <div class="login-header">
      <h1>Welcome back</h1>
      <p>Sign in to continue</p>
    </div>

    <!-- Form -->
    <form id="loginForm">
      <!-- Email -->
      <div class="input-group">
        <span class="input-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
        </span>
        <input type="email" id="email" name="email" placeholder=" " required autocomplete="email">
        <label for="email">Email</label>
      </div>

      <!-- Password -->
      <div class="input-group">
        <span class="input-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </span>
        <input type="password" id="password" name="password" placeholder=" " required autocomplete="current-password">
        <label for="password">Password</label>
        <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
          <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
      </div>

      <!-- Options -->
      <div class="form-options">
        <label class="remember">
          <input type="checkbox" id="remember" name="remember">
          <span>Remember me</span>
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn-login" id="submitBtn">Sign In</button>

      <div class="form-message" id="formMessage" aria-live="polite"></div>
    </form>

    <div class="divider">or</div>

    <button type="button" class="btn-social">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <p class="signup">Don't have an account? <a href="#">Sign up</a></p>
  </div>

  <script>
    // ---------- Show / hide password ----------
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    toggleBtn.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      toggleBtn.classList.toggle('visible', isHidden);
      toggleBtn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      passwordInput.focus();
    });

    // ---------- Form submit ----------
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const message = document.getElementById('formMessage');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      message.classList.remove('show');

      const data = {
        email: document.getElementById('email').value,
        password: passwordInput.value,
        remember: document.getElementById('remember').checked
      };

      // 🔧 Send data to your server here, e.g.:
      // fetch('/api/login', { method: 'POST', body: JSON.stringify(data), ... })

      console.log('Submitting:', data);

      // Demo loading state
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      setTimeout(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
        message.textContent = '✅ Signed in successfully! (demo — connect your server)';
        message.classList.add('show', 'success');
      }, 1200);
    });
  </script>
</body>
</html>
